name: agrisense_madagascar
description: Progressive agricultural app for Madagascar farmers with AI diagnosis, weather alerts, and offline support.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  
  # HTTP & Serialization
  http: ^1.1.0
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Maps
  google_maps_flutter: ^2.7.0
  
  # AI & Voice
  google_generative_ai: ^0.3.0
  speech_to_text: ^6.5.0
  flutter_tts: ^3.8.5
  
  # Charts
  fl_chart: ^0.65.0
  
  # UI & Images
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  
  # Localization
  easy_localization: ^3.0.0
  
  # Utilities
  intl: ^0.20.2
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # JSON serialization
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/weather/
    - assets/voly/
