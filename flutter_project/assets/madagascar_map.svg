  <!-- Haute Matsiatra Region (South) -->
  <path d="M 370 480 L 400 480 L 410 540 L 380 545 Z" fill="#FF8C8C" opacity="0.7" stroke="#333" stroke-width="2"/>
  
  <!-- Menabe Region (West) -->
  <path d="M 330 380 L 360 375 L 370 450 L 340 460 Z" fill="#8CFFFF" opacity="0.7" stroke="#333" stroke-width="2"/>
  
  <!-- Ihorombe Region (South) -->
  <path d="M 360 520 L 390 510 L 400 570 L 370 575 Z" fill="#FFFF8C" opacity="0.7" stroke="#333" stroke-width="2"/>
  
  <!-- Atsimo-Atsinanana Region (Far Southeast) -->
