  <!-- Sava Region (Northeast) -->
  <path d="M 430 120 L 470 110 L 490 150 L 470 180 L 430 150 Z" fill="#33CCFF" opacity="0.7" stroke="#333" stroke-width="2"/>
  
  <!-- Analanjirofo Region (East) -->
  <path d="M 470 180 L 490 150 L 510 200 L 500 240 L 470 220 Z" fill="#FF338C" opacity="0.7" stroke="#333" stroke-width="2"/>
  
  <!-- Atsinanana Region (Southeast) -->
